<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炎上体験シミュレーター</title>
    <link rel="stylesheet" href="./CSS/enjyou.css">
</head>
<body>
    <div class="side-box">
        <div class="item active">ホーム</div>
        <div class="item">話題検索</div>
        <div class="item">通知 <span class="nav-badge hide" id="noti-count">0</span></div>
        <div class="item">メッセージ</div>
        <div class="item">ブックマーク</div>
        <div class="item">プロフィール</div>
        <div class="item">もっと見る</div>
        <button class="side-post-button">ポストする</button>
    </div>
    <div class="timeline-container">
        <div class="timeline-header">
            <h2>ホーム </h2>
        </div>
        <div class="input-box">
            <div class="avatar-area">
                <div class="default-avatar" style="width: 40px; height: 40px; background-color: #e1e8ed; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px;">👤</div>
            </div>
            <div class="input-main-area">
                <textarea id="user-input" placeholder="いま何してる？" rows="1"></textarea>
                <div class="button-area hide" id="button-area">
                    <button id="post-button">ポストする</button>
                </div>
            </div>
        </div>
        <div class="empty-state" id="empty-message">
            <h3>まだ投稿がありません</h3>
            <p>何か投稿して、ネット炎上の恐怖を体験しましょう...</p>
        </div>
        <div class="tweet-box hide" id="main-tweet">
            <div class="avatar-area">
                <img src="https://placehold.co" alt="本人のアイコン" style="display: none;">
                <div class="default-avatar" style="width: 40px; height: 40px; background-color: #e1e8ed; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px;">👤</div>
            </div>
            <div class="main-content-area">
                <div class="user-info">
                    <div class="display-name">あなた</div>
                    <div class="user-id">@you</div>
                    <div class="post-time">・今</div>
                </div> 
                <div class="tweet-text" id="target-tweet-text"></div>

                <div class="status-bar">
                    <span class="status-item reply-color">💬 <span id="count-reply">0</span></span>
                    <span class="status-item repost-color">🔁 <span id="count-repost">0</span></span>
                    <span class="status-item like-color">❤️ <span id="count-like">0</span></span>
                </div>
            </div> 
        </div>
        <div class="reply-area hide" id="reply-container">
            </div>
    </div>
    <div class="right-box">
        <div class="info-card">
            <div class="simulator-info" style="padding: 16px; background-color: #f7f9fa; border-radius: 16px;">
                <h2 style="font-size: 18px; color: #ff4d4d; margin: 0 0 8px 0; font-weight: bold;">炎上体験シミュレーター</h2>
                <p style="font-size: 13px; color: #657786; margin: 0; line-height: 1.5;">これはSNSの恐怖を安全に疑似体験するためのツールです。<br>投稿後にどれだけ早く批判的な反応が広がるかを再現しています。</p>
            </div>
        </div>
    </div>

    <script src="./JavaScript/enjyou.js"></script>
</body>
</html>
